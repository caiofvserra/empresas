# Rotina mensal da triagem dos serviços gerais do PNCP com o modelo treinado (scripts/pncp-triagem.py), 07/11/2026.
# Roda todo dia 5, às 6h de Brasília, sobre o mês anterior; a primeira vez, sem staging guardado, cobre os 12 meses anteriores.
# Também roda à mão em Actions > Triagem do PNCP > Run workflow, com datas opcionais.
# Cada execução trabalha até 5 horas e guarda o que fez. Se sobrar trabalho (a primeira rodada de 12 meses passa disso), ela
# se chama de novo com o mesmo período, e a seguinte pula os contratos que já têm linha no staging; para quando acaba ou quando
# uma execução inteira não grava nada.
#
# Uma vez só, antes da primeira rodada: crie a release `modelo-pncp` e anexe o pacote_reuso.joblib do Drive
# (Releases > Draft a new release > tag modelo-pncp > anexar o arquivo > Publish). O staging, com número de controle e CNPJ,
# fica na release `pncp-triagem-dados` deste repositório privado, fora do Git; no Git entra só o JSON de números do painel.
name: Triagem do PNCP

on:
  schedule:
    - cron: '0 9 5 * *'
  workflow_dispatch:
    inputs:
      de: { description: 'Início (AAAA-MM-DD). Vazio = mês anterior, ou 12 meses na primeira rodada', required: false }
      ate: { description: 'Fim (AAAA-MM-DD). Vazio = último dia do mês anterior', required: false }

permissions:
  contents: write
  actions: write

concurrency:
  group: pncp-triagem
  cancel-in-progress: false

jobs:
  triagem:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependências (CPU, OCR em português)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y tesseract-ocr-por > /dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          # O pacote foi treinado com o scikit-learn 1.6.1; outra versão avisa e pode mudar a probabilidade. SKLEARN_VERSAO
          # (variável do repositório) troca a versão se um pacote novo vier de outro treino.
          pip install -q sentence-transformers joblib pymupdf "scikit-learn==${{ vars.SKLEARN_VERSAO || '1.6.1' }}"

      - name: Cache do encoder (BAAI/bge-m3)
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-v1

      - name: Modelo treinado e staging das rodadas anteriores
        run: |
          mkdir -p var/modelo var/pncp
          gh release download modelo-pncp -p pacote_reuso.joblib -D var/modelo \
            || { echo "::error::Falta a release modelo-pncp com o pacote_reuso.joblib (ver o começo deste arquivo)."; exit 1; }
          gh release download pncp-triagem-dados -p triagem-sp.csv -D var/pncp 2>/dev/null || echo "Primeira rodada: sem staging guardado."

      - name: Coleta das execuções anteriores
        uses: actions/cache/restore@v5
        with:
          path: var/pncp/contratos-*.json
          key: pncp-contratos-${{ github.run_id }}
          restore-keys: pncp-contratos-

      - name: Período
        id: periodo
        run: |
          inicio_mes=$(date -u +%Y-%m-01)
          ate="${{ inputs.ate }}"; de="${{ inputs.de }}"
          [ -n "$ate" ] || ate=$(date -u -d "$inicio_mes -1 day" +%F)
          if [ -z "$de" ]; then
            if [ -f var/pncp/triagem-sp.csv ]; then de=$(date -u -d "$inicio_mes -1 month" +%F); else de=$(date -u -d "$inicio_mes -12 months" +%F); fi
          fi
          echo "de=$de" >> "$GITHUB_OUTPUT"; echo "ate=$ate" >> "$GITHUB_OUTPUT"
          echo "Período: $de a $ate"

      # Um mês leva perto de uma hora (coleta 10 min, embeddings em CPU 25 min, documentos 25 min). O prazo só impede começar
      # mês, página ou compra nova; com 270 min, o que já começou termina antes dos 350 do job.
      - name: Triagem
        id: triagem
        run: python3 scripts/pncp-triagem.py --pacote var/modelo/pacote_reuso.joblib --de ${{ steps.periodo.outputs.de }} --ate ${{ steps.periodo.outputs.ate }} --minutos 270

      - name: Guardar o staging (fora do Git)
        if: always()
        run: |
          [ -f var/pncp/triagem-sp.csv ] || exit 0
          gh release view pncp-triagem-dados > /dev/null 2>&1 || gh release create pncp-triagem-dados --prerelease \
            --title "Staging da triagem do PNCP" --notes "triagem-sp.csv para a carga de stg.pncp_triagem (integrations/sql/pncp-triagem-x-art.sql). Atualizado pela rotina mensal."
          gh release upload pncp-triagem-dados var/pncp/triagem-sp.csv --clobber

      - name: Guardar a coleta para a próxima execução
        if: always()
        uses: actions/cache/save@v5
        with:
          path: var/pncp/contratos-*.json
          key: pncp-contratos-${{ github.run_id }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # Em cinco horas a main recebe outros commits, e o HTML de entrega gerado conflita com o deles. Por isso o painel é
      # refeito em cima da main mais nova, só com o JSON desta rodada trazido de fora, e de novo se o push perder a corrida.
      - name: Painel com a rodada nova
        run: |
          cp src/domain/pncp-triagem-sp.json "$RUNNER_TEMP/pncp-triagem-sp.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/pncp-triagem-sp.json" src/domain/pncp-triagem-sp.json
            git diff --quiet -- src/domain/pncp-triagem-sp.json && { echo "Nada mudou no painel."; exit 0; }
            npm ci --no-audit --no-fund
            npm test
            npm run build:painel
            git add src/domain/pncp-triagem-sp.json entrega/
            git commit -q -m "Triagem do PNCP: rodada de $(date -u +%F) (${{ steps.periodo.outputs.de }} a ${{ steps.periodo.outputs.ate }})"
            git push origin HEAD:main && exit 0
            echo "A main mudou durante o build; refazendo (tentativa $tentativa)."
          done
          exit 1

      # Depende só da triagem: uma falha no painel não interrompe a sequência, e a próxima parte refaz o painel.
      - name: Continuar o que sobrou
        if: always() && steps.triagem.outcome == 'success'
        run: |
          [ -f var/pncp/pendente ] || { echo "Nada pendente."; exit 0; }
          cat var/pncp/pendente
          gh workflow run pncp-triagem.yml --ref main -f de=${{ steps.periodo.outputs.de }} -f ate=${{ steps.periodo.outputs.ate }}
